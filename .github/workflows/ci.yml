name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (oxlint)
        run: npm run lint

      - name: Compilar
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas end-to-end
        run: npm run test:e2e